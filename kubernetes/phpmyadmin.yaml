

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: growdeck
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
        - name: phpmyadmin
          image: phpmyadmin:latest
          ports:
            - containerPort: 80
          env:
            - name: PMA_ARBITRARY
              value: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin-service
  namespace: growdeck
spec:
  selector:
    app: phpmyadmin
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
